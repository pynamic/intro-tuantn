<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Đã gửi thành công</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: rgba(0,0,0,0.6);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}
.popup {
    background: #fff;
    width: 350px;
    padding: 25px;
    border-radius: 10px;
    text-align: center;
    animation: fadeIn .3s ease;
}
.popup h2 {
    margin-top: 0;
    color: #28a745;
}
.popup p {
    margin: 10px 0 20px;
}
.popup button {
    background: #007bff;
    padding: 10px 20px;
    color: #fff;
    border: 0;
    border-radius: 5px;
    cursor: pointer;
}
.popup button:hover {
    background: #0056b3;
}
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-10px); }
    to   { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<div class="popup">
    <h2>Gửi thành công!</h2>
    <p>Cảm ơn bạn đã liên hệ. Chúng tôi sẽ phản hồi sớm nhất.</p>
    <button onclick="window.location.href='index.html'">Quay lại trang chủ</button>
</div>

</body>
</html>
